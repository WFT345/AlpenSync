# Version catalog — exact versions only (plan Rule 11: pin and verify).
# Any version bump requires a justification in DEPENDENCIES.md.
#
# M1 note: kotlin/AGP and all networking/crypto pins match pcontacts'
# gradle/libs.versions.toml @ bf9b0c5 — the combination live-verified
# against the production Proton API (docs/research/m1-auth-api-notes.md §6).
# kotlinx-serialization 1.11.0 requires a Kotlin 2.4.x compiler, hence the
# kotlin bump from the M0 pin (2.1.21).

[versions]
agp = "8.11.2"
kotlin = "2.4.10"
compose-bom = "2025.05.01"
activity-compose = "1.10.1"
lifecycle-runtime-compose = "2.9.1"
junit = "4.13.2"
detekt = "1.23.8"
dependencycheck = "12.1.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
okhttp = "5.4.0"
retrofit = "3.0.0"
bouncycastle = "1.85"
androidx-security-crypto = "1.1.0-alpha06"
# M2b: matches pcontacts' live-verified pin (docs/research/m2-contacts-notes.md
# §2.4); protoncore uses ez-vcard for contact cards too.
ezvcard = "0.12.2"
# M2c: KSP + Room + Robolectric. Room 2.8.4 and KSP 2.3.11 are Dependabot
# bumps on the original pcontacts-matched pins (Kotlin 2.4.10).
ksp = "2.3.11"
androidx-room = "2.8.4"
robolectric = "4.16.1"
androidx-test-core = "1.7.0"
# M2d: WorkManager (the periodic requestSync poker) + the androidTest runner
# stack — all pins match pcontacts @ bf9b0c5 (docs/research/m2-contacts-notes.md
# Section 4.1; the WorkManager pin is their shipped, live-verified one).
androidx-work = "2.9.1"
androidx-test-junit = "1.2.1"
androidx-test-runner = "1.7.0"
androidx-test-rules = "1.7.0"

# compileSdk/targetSdk/minSdk live in each module's build.gradle.kts:
# compileSdk 36, targetSdk 36, minSdk 26 (pinned by the M0 brief).

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle-runtime-compose" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
bouncycastle-bcpg = { group = "org.bouncycastle", name = "bcpg-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "androidx-security-crypto" }
ezvcard = { group = "com.googlecode.ez-vcard", name = "ez-vcard", version.ref = "ezvcard" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidx-room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidx-room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidx-room" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidx-work" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidx-test-rules" }

[bundles]
bouncycastle = ["bouncycastle-bcpg", "bouncycastle-bcprov"]
room = ["androidx-room-runtime", "androidx-room-ktx"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dependencycheck = { id = "org.owasp.dependencycheck", version.ref = "dependencycheck" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
