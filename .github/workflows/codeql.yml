name: CodeQL

# CodeQL analysis for Java/Kotlin (plan Rule 7: free for public repos).
# NOTE: CodeQL's Android/Kotlin support may need tuning once this runs on
# GitHub-hosted runners (e.g. build-mode manual vs autobuild, or limiting
# analysis to the modules that contain code). Treat the first runs as
# calibration; adjust this workflow rather than disabling it.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build for analysis
        run: ./gradlew assembleDebug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
