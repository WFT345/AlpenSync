name: CI

# Section 4 gates (plan Rule 7): build, unit tests, lint, detekt, secret scan,
# dependency scan — all run on every push and PR. High-severity findings block.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, test, lint, detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test, lint, detekt
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug detekt

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: secrets must not hide in old commits
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency vulnerability scan (OWASP dependency-check)
    runs-on: ubuntu-latest
    # IMPORTANT: this job is advisory until the NVD_API_KEY repository secret
    # is configured (free key: https://nvd.nist.gov/developers/request-an-api-key).
    # Without the key the NVD feed download is throttled past CI timeouts.
    # Once the secret exists, REMOVE `continue-on-error: true` so
    # high-severity findings block merges, as plan Rule 7 requires.
    # Tracked in DEPENDENCIES.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          if-no-files-found: ignore
